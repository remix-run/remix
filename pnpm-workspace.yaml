allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  workerd: true

catalog:
  '@types/hast': 3.0.5
  '@types/node': ^24.6.0
  github-slugger: 2.0.0
  oxfmt: ^0.51.0
  pagefind: 1.5.2
  # The lockfile holds 1.63: 1.64's Firefox stalls on GitHub's Windows runners, and 1.62's WebKit
  # fails navigation history tests.
  playwright: ^1.63.0
  shiki: 4.4.1
  typescript: ^7.0.2

packages:
  - demos/*
  - docs/site
  - docs/shared
  - docs/ui
  - docs/shared/prerender/bench
  - packages/*
  - packages/*/demo
  - packages/assets/bench
  - packages/cli/test/fixtures/*
  - packages/component/bench
  - packages/component/bench/frameworks/*
  - packages/data-schema/bench
  - packages/fetch-router/demos/*
  - packages/form-data-parser/demos/*
  - packages/lazy-file/scripts
  - packages/multipart-parser/bench
  - packages/multipart-parser/demos/*
  - packages/node-fetch-server/bench
  - packages/node-fetch-server/demos/*
  - packages/route-pattern/bench
  - packages/tar-parser/bench
  - template
  - scripts

patchedDependencies:
  playwright-core@1.63.0: patches/playwright-core@1.63.0.patch

shellEmulator: true
