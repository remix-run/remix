name: Publish

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Check release readiness
    runs-on: ubuntu-latest
    outputs:
      has_change_files: ${{ steps.check.outputs.has_change_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for change files
        id: check
        run: |
          # Look for change files in any package's .changes directory (excluding README.md)
          change_files=$(find packages -maxdepth 3 -type f -path 'packages/*/.changes/*.md' ! -name "README.md")
          if [ -n "$change_files" ]; then
            echo "Change files found (blocking publish):"
            echo "$change_files"
            echo "has_change_files=true" >> $GITHUB_OUTPUT
          else
            echo "No change files found, proceeding to publish."
            echo "has_change_files=false" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish any unreleased packages
    needs: check
    if: needs.check.outputs.has_change_files == 'false'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}

    permissions:
      contents: write # Required for creating tags and GitHub releases
      id-token: write # OIDC ID token is used for authentication with npm/jsr

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Validate generated remix package files
        run: pnpm run validate-remix-package

      - name: Publish to npm and create releases
        id: publish
        run: node ./scripts/publish.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  roadmap:
    name: Archive released roadmap items
    needs: publish
    if: startsWith(needs.publish.outputs.tag, 'remix@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find released pull requests
        id: released-prs
        run: node scripts/released-prs.ts
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}

      - name: Archive the Remix Roadmap's Merged column
        uses: actions/github-script@v8
        env:
          RELEASED_PRS: ${{ steps.released-prs.outputs.numbers }}
        with:
          # Requires organization Projects read/write access.
          github-token: ${{ secrets.GH_REMIX_PAT }}
          script: |
            let numbers = JSON.parse(process.env.RELEASED_PRS);
            if (!Array.isArray(numbers) || !numbers.every(Number.isSafeInteger)) {
              throw new Error('Could not determine the released pull requests.');
            }
            let releasedPrs = new Set(numbers);

            async function isReleasedIssue(id) {
              let cursor = null;
              do {
                let { node } = await github.graphql(`
                  query($id: ID!, $cursor: String) {
                    node(id: $id) {
                      ... on Issue {
                        closedByPullRequestsReferences(first: 100, after: $cursor, includeClosedPrs: true) {
                          nodes { number merged repository { nameWithOwner } }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                `, { id, cursor });
                let references = node?.closedByPullRequestsReferences;
                if (!references) throw new Error(`Could not read closing PRs for ${id}.`);
                if (references.nodes.some((pr) => pr?.merged &&
                    pr.repository.nameWithOwner === 'remix-run/remix' && releasedPrs.has(pr.number))) {
                  return true;
                }
                cursor = references.pageInfo.hasNextPage ? references.pageInfo.endCursor : null;
              } while (cursor);
              return false;
            }

            let cursor = null;
            let projectId;
            let itemIds = [];
            do {
              let { organization } = await github.graphql(`
                query($cursor: String) {
                  organization(login: "remix-run") {
                    projectV2(number: 31) {
                      id
                      items(first: 100, after: $cursor) {
                        nodes {
                          id
                          isArchived
                          content {
                            __typename
                            ... on PullRequest { number merged repository { nameWithOwner } }
                            ... on Issue { id }
                          }
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                            }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }
              `, { cursor });
              let project = organization?.projectV2;
              if (!project) throw new Error('Could not find the Remix Roadmap.');
              projectId = project.id;
              for (let item of project.items.nodes) {
                let status = item?.fieldValueByName;
                if (item?.isArchived || status?.name !== 'Merged') continue;
                let content = item.content;
                if (content?.__typename === 'PullRequest' && content.merged &&
                    content.repository.nameWithOwner === 'remix-run/remix' &&
                    releasedPrs.has(content.number)) {
                  itemIds.push(item.id);
                } else if (content?.__typename === 'Issue' && await isReleasedIssue(content.id)) {
                  itemIds.push(item.id);
                }
              }
              cursor = project.items.pageInfo.hasNextPage
                ? project.items.pageInfo.endCursor
                : null;
            } while (cursor);

            // Read every page before archiving so mutations cannot shift pagination.
            for (let itemId of itemIds) {
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!) {
                  archiveProjectV2Item(input: { projectId: $projectId, itemId: $itemId }) {
                    item { id }
                  }
                }
              `, { projectId, itemId });
            }
            core.info(`Archived ${itemIds.length} released items from the Remix Roadmap.`);

  docs:
    name: Deploy docs
    needs: publish
    # Don't run on no-op publish runs (i.e., docs updates on a clean main branch)
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Docs and UI deploys
        uses: actions/github-script@v8
        with:
          # Needs permission to dispatch events to both docs repos.
          github-token: ${{ secrets.REMIX_API_DOCS_PAT }}
          script: |
            let ref = '${{ needs.publish.outputs.tag }}';
            let deploys = [
              ['remix-docs', 'update-docs'],
              ['remix-ui-docs', 'update-ui'],
            ];
            for (let [repo, event_type] of deploys) {
              await github.rest.repos.createDispatchEvent({
                owner: 'remix-run',
                repo,
                event_type,
                client_payload: { ref },
              });
            }
