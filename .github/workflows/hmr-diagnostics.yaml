name: HMR timing diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/hmr-diagnostics.yaml
      - packages/assets/test/hmr.test.e2e.tsx
      - packages/component-hmr/test/hmr.test.e2e.tsx

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    name: HMR timing (Windows, ${{ matrix.mode }} ${{ matrix.iteration }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [workspace, isolated]
        iteration: [1, 2, 3]
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: ./.github/actions/setup-node-pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright Version
        id: playwright-version
        shell: bash
        run: echo "version=$(pnpm --filter @remix-run/component exec playwright --version | cut -d ' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: cache-browsers
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @remix-run/component exec playwright install --with-deps chromium firefox

      - name: Repeat native HMR waits
        timeout-minutes: 12
        shell: bash
        env:
          REMIX_HMR_DIAGNOSTICS: '1'
          HMR_DIAGNOSTIC_MODE: ${{ matrix.mode }}
          HMR_REPRO_BASE_SHA: 21567dc53cd2501cdc6a2ced0f32815e2410eb5f
          HMR_REPRO_HEAD_SHA: a2feaf983bf4248fc3158a86a85cc59f664fa79f
        run: |
          mkdir -p diagnostics
          if [[ "$HMR_DIAGNOSTIC_MODE" == workspace ]]; then
            node ./scripts/detect-changed-packages.ts "$HMR_REPRO_BASE_SHA" "$HMR_REPRO_HEAD_SHA" 2>&1 | tee diagnostics/run.log
          else
            failed=0
            for ((iteration=1; iteration<=30; iteration++)); do
              if ! pnpm --filter @remix-run/component-hmr test --quiet test/hmr.test.e2e.tsx --project firefox \
                --only 'updates component render output without losing setup state' 2>&1 | tee "diagnostics/run-$iteration.log"; then
                failed=1
              fi
            done
            exit "$failed"
          fi

      - name: Upload timing diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hmr-timing-windows-${{ matrix.mode }}-${{ matrix.iteration }}
          path: diagnostics/
          retention-days: 7
