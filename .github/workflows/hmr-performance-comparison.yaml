name: HMR performance comparison

on:
  push:
    branches:
      - markdalgleish/hmr-client-entry-hydration-timeout

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: ./.github/actions/setup-node-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remix-run/component exec playwright install webkit
      - name: isolated-before
        run: node scripts/hmr-performance-run.mjs full-isolated-before pnpm --filter @remix-run/component-hmr test --quiet test/hmr-client-entry.test.e2e.tsx --only 'adds hydration boundaries in fresh responses when clientEntry is added through node-hmr'
      - name: full4-inner-default
        run: node scripts/hmr-performance-full.mjs full4-inner-default 4
      - name: full1-inner-default
        run: node scripts/hmr-performance-full.mjs full1-inner-default 1
      - name: isolated-after
        run: node scripts/hmr-performance-run.mjs full-isolated-after pnpm --filter @remix-run/component-hmr test --quiet test/hmr-client-entry.test.e2e.tsx --only 'adds hydration boundaries in fresh responses when clientEntry is added through node-hmr'
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmr-performance-comparison
          path: .tmp/hmr-performance
