name: Investigate carousel timeout

on:
  push:
    branches:
      - markdalgleish/investigate-carousel-timeouts

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        sample: [baseline, observe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CAROUSEL_OBSERVE_AFTER_TIMEOUT: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: ./.github/actions/setup-node-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            pnpm exec playwright install webkit
          else
            pnpm exec playwright install --with-deps chromium firefox
          fi
      - name: Isolated repetitions
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p investigation-logs
          node -e 'console.log({platform:process.platform, arch:process.arch, cpus:require("node:os").availableParallelism(), node:process.version})'
          project=firefox
          if [[ "$RUNNER_OS" == macOS ]]; then project=webkit; fi
          status=0
          for repetition in 1; do
            pnpm -C demos/record-store test app/actions/albums/image-carousel.test.e2e.ts --project "$project" > "investigation-logs/isolated-$repetition.log" 2>&1 || status=1
            cat "investigation-logs/isolated-$repetition.log"
          done
          exit "$status"
      - name: Main suite concurrency
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:browser 2>&1 | tee investigation-logs/suite.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: carousel-${{ matrix.os }}-${{ matrix.sample }}
          path: investigation-logs
