name: Spring iterator diagnostics

on:
  push:
    branches: [markdalgleish/spring-iterator-timeout]

permissions:
  contents: read

jobs:
  timing:
    name: WebKit timing (${{ matrix.order }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        order: ['4,1', '1,4']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7f25fa884c57dd746e46999c4faaf300c5c04ab0

      - uses: pnpm/action-setup@v6
      - uses: ./.github/actions/setup-node-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remix-run/component exec playwright install webkit

      - name: Record environment
        run: |
          git rev-parse HEAD
          sw_vers
          sysctl hw.ncpu hw.memsize
          node --version
          pnpm --filter @remix-run/component exec playwright --version

      - name: Measure both complete workspace runs
        env:
          CI: 'true'
          CONCURRENCY_ORDER: ${{ matrix.order }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'spring-timing'
          root.mkdir()
          script = Path('scripts/test-browser.ts')
          source = script.read_text()
          assert source.count('--workspace-concurrency=4') == 1
          assert source.count("'--recursive',") == 1
          source = source.replace("'--recursive',", "'--recursive', '--no-bail',")
          results = []
          try:
              for concurrency in os.environ['CONCURRENCY_ORDER'].split(','):
                  script.write_text(source.replace('--workspace-concurrency=4', f'--workspace-concurrency={concurrency}'))
                  log = root / f'concurrency-{concurrency}.log'
                  print(f'Starting full suite with workspace concurrency {concurrency}', flush=True)
                  started = time.perf_counter()
                  with log.open('w') as output:
                      result = subprocess.run(['pnpm', 'test:browser'], stdout=output, stderr=subprocess.STDOUT)
                  elapsed = time.perf_counter() - started
                  record = {'concurrency': int(concurrency), 'elapsedSeconds': elapsed, 'exitCode': result.returncode}
                  results.append(record)
                  (root / 'results.json').write_text(json.dumps(results, indent=2))
                  print(json.dumps(record), flush=True)
                  print('\n'.join(log.read_text().splitlines()[-30:]), flush=True)
          finally:
              script.write_text(source.replace("'--recursive', '--no-bail',", "'--recursive',"))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('```json\n' + json.dumps(results, indent=2) + '\n```\n')
          PYTHON

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spring-timing-${{ matrix.order }}
          path: ${{ runner.temp }}/spring-timing
          retention-days: 7
