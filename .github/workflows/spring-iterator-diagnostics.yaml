name: Spring iterator diagnostics

on:
  push:
    branches: [markdalgleish/spring-iterator-timeout]

permissions:
  contents: read

jobs:
  repeat:
    name: WebKit (${{ matrix.mode }}, batch ${{ matrix.batch }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [docs-only, overlap]
        batch: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7f25fa884c57dd746e46999c4faaf300c5c04ab0

      - name: Apply diagnostics without changing the tested implementation
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: |
          git fetch --depth=1 origin "$DIAGNOSTIC_SHA"
          git show "$DIAGNOSTIC_SHA:docs/ui/app/examples/animation/spring/iterator.example.test.browser.tsx" > docs/ui/app/examples/animation/spring/iterator.example.test.browser.tsx
          git diff --stat

      - uses: pnpm/action-setup@v6
      - uses: ./.github/actions/setup-node-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remix-run/component exec playwright install webkit

      - name: Record environment
        run: |
          git rev-parse HEAD
          sw_vers
          sysctl hw.ncpu hw.memsize
          node --version
          pnpm --filter @remix-run/component exec playwright --version

      - name: Repeat workspace tests
        shell: bash
        env:
          CI: 'true'
          TEST_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/spring-diagnostics"
          failed=0
          filters=(--filter ./docs/ui)
          if [ "$TEST_MODE" = overlap ]; then filters+=(--filter ./packages/ui); fi
          set +e
          for repetition in {1..5}; do
            echo "::group::$TEST_MODE repetition $repetition"
            pnpm --recursive --no-sort --workspace-concurrency=4 --stream "${filters[@]}" run test --type browser --type e2e --browser.echo 2>&1 | tee "$RUNNER_TEMP/spring-diagnostics/workspaces-$repetition.log"
            status=${PIPESTATUS[0]}
            echo "$TEST_MODE $repetition $status" | tee -a "$RUNNER_TEMP/spring-diagnostics/results.txt"
            if [ "$status" -ne 0 ]; then failed=1; fi
            echo '::endgroup::'
          done
          exit "$failed"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spring-${{ matrix.mode }}-${{ matrix.batch }}
          path: ${{ runner.temp }}/spring-diagnostics
          retention-days: 7
