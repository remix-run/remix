name: Spring iterator diagnostics

on:
  push:
    branches: [markdalgleish/spring-iterator-timeout]

permissions:
  contents: read

jobs:
  repeat:
    name: WebKit telemetry (${{ matrix.diagnostics }}, batch ${{ matrix.batch }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        diagnostics: [native, worker]
        batch: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7f25fa884c57dd746e46999c4faaf300c5c04ab0

      - name: Apply diagnostics without changing the tested implementation
        env:
          DIAGNOSTIC_SHA: ${{ matrix.diagnostics == 'native' && 'e911b3f2629ba0cae548199d511095b28a3cb365' || github.sha }}
        run: |
          git fetch --depth=1 origin "$DIAGNOSTIC_SHA"
          git show "$DIAGNOSTIC_SHA:docs/ui/app/examples/animation/spring/iterator.example.test.browser.tsx" > docs/ui/app/examples/animation/spring/iterator.example.test.browser.tsx
          git diff --stat

      - uses: pnpm/action-setup@v6
      - uses: ./.github/actions/setup-node-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remix-run/component exec playwright install webkit

      - name: Record environment
        run: |
          git rev-parse HEAD
          sw_vers
          sysctl hw.ncpu hw.memsize
          node --version
          pnpm --filter @remix-run/component exec playwright --version

      - name: Replay interaction reproduction with process telemetry
        shell: bash
        env:
          CI: 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/spring-diagnostics"
          top -l 0 -s 1 -n 30 -o cpu -stats pid,ppid,command,cpu,mem,state,threads,time > "$RUNNER_TEMP/spring-diagnostics/top.log" 2>&1 &
          top_pid=$!
          vm_stat 1 > "$RUNNER_TEMP/spring-diagnostics/vm-stat.log" 2>&1 &
          vm_pid=$!
          trap 'kill "$top_pid" "$vm_pid" 2>/dev/null || true' EXIT
          set +e
          (
            interaction_failed=0
            for repetition in {1..3}; do
              DEBUG=pw:api,pw:browser pnpm --filter @remix-run/ui test src/test/dialog.test.e2e.ts src/test/focus-portal.test.e2e.ts --project webkit > "$RUNNER_TEMP/spring-diagnostics/interactions-$repetition.log" 2>&1
              status=$?
              echo "interactions $repetition $status" | tee -a "$RUNNER_TEMP/spring-diagnostics/interactions-results.txt"
              if [ "$status" -ne 0 ]; then interaction_failed=1; fi
            done
            exit "$interaction_failed"
          ) &
          interaction_pid=$!
          failed=0
          for repetition in {1..12}; do
            echo "::group::Spring repetition $repetition"
            DEBUG=pw:browser pnpm --filter remix-ui-docs test app/examples/animation/spring/iterator.example.test.browser.tsx --project webkit --browser.echo 2>&1 | tee "$RUNNER_TEMP/spring-diagnostics/spring-$repetition.log"
            status=${PIPESTATUS[0]}
            echo "spring $repetition $status" | tee -a "$RUNNER_TEMP/spring-diagnostics/results.txt"
            if [ "$status" -ne 0 ]; then failed=1; fi
            echo '::endgroup::'
          done
          wait "$interaction_pid"
          if [ "$?" -ne 0 ]; then failed=1; fi
          ps -axo pid,ppid,command > "$RUNNER_TEMP/spring-diagnostics/processes.log"
          exit "$failed"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spring-telemetry-${{ matrix.diagnostics }}-${{ matrix.batch }}
          path: ${{ runner.temp }}/spring-diagnostics
          retention-days: 7
