name: Spring iterator diagnostics

on:
  push:
    branches: [markdalgleish/spring-iterator-timeout]

permissions:
  contents: read

jobs:
  repeat:
    name: WebKit churn (${{ matrix.workload }}, batch ${{ matrix.batch }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workload: [pages, contexts]
        batch: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7f25fa884c57dd746e46999c4faaf300c5c04ab0

      - name: Apply diagnostics without changing the tested implementation
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: |
          git fetch --depth=1 origin "$DIAGNOSTIC_SHA"
          git show "$DIAGNOSTIC_SHA:docs/ui/app/examples/animation/spring/iterator.example.test.browser.tsx" > docs/ui/app/examples/animation/spring/iterator.example.test.browser.tsx
          git diff --stat

      - uses: pnpm/action-setup@v6
      - uses: ./.github/actions/setup-node-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remix-run/component exec playwright install webkit

      - name: Record environment
        run: |
          git rev-parse HEAD
          sw_vers
          sysctl hw.ncpu hw.memsize
          node --version
          pnpm --filter @remix-run/component exec playwright --version

      - name: Compare spring with separate browser workloads
        shell: bash
        env:
          CI: 'true'
          WORKLOAD: ${{ matrix.workload }}
        run: |
          mkdir -p "$RUNNER_TEMP/spring-diagnostics"
          set +e
          cat > packages/component/spring-page-diagnostics.mjs <<'JAVASCRIPT'
          import { webkit } from 'playwright'
          let stopped = false
          process.once('SIGTERM', () => { stopped = true })
          let browser = await webkit.launch()
          try {
            let context = await browser.newContext()
            for (let index = 0; index < 64 && !stopped; index++) {
              console.log('Page creation started', index, Date.now())
              let page = process.env.WORKLOAD === 'contexts'
                ? await browser.newPage()
                : await context.newPage()
              await page.setContent('<!doctype html><input><button>Plain browser page</button>')
              await page.evaluate(() => new Promise((resolve) => requestAnimationFrame(resolve)))
              await page.close()
              console.log('Page creation finished', index, Date.now())
            }
          } finally {
            await browser.close()
          }
          JAVASCRIPT
          DEBUG=pw:api node packages/component/spring-page-diagnostics.mjs > "$RUNNER_TEMP/spring-diagnostics/pages.log" 2>&1 &
          workload_pid=$!
          failed=0
          for repetition in {1..8}; do
            echo "::group::Spring repetition $repetition"
            pnpm --filter remix-ui-docs test app/examples/animation/spring/iterator.example.test.browser.tsx --project webkit --browser.echo 2>&1 | tee "$RUNNER_TEMP/spring-diagnostics/spring-$repetition.log"
            status=${PIPESTATUS[0]}
            echo "spring $repetition $status" | tee -a "$RUNNER_TEMP/spring-diagnostics/results.txt"
            if [ "$status" -ne 0 ]; then failed=1; fi
            echo '::endgroup::'
          done
          if kill -0 "$workload_pid" 2>/dev/null; then
            kill -TERM "$workload_pid"
          fi
          wait "$workload_pid"
          if [ "$?" -ne 0 ]; then failed=1; fi
          exit "$failed"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spring-churn-${{ matrix.workload }}-${{ matrix.batch }}
          path: ${{ runner.temp }}/spring-diagnostics
          retention-days: 7
